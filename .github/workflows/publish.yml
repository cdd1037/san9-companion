name: Verify and publish Windows x86

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Debug x86
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fast model, runtime, configuration and UI checks
        run: ./Verify.ps1 -Runtime -TestSuite Quick

      - name: Complete runtime fault sweep
        run: |
          & ./build/tests/Debug/San9RuntimeTests.exe --all ./assets/config | Tee-Object -FilePath out/runtime-full.txt
          if ($LASTEXITCODE -ne 0) { throw 'Complete runtime verification failed' }

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Debug-verification-diagnostics
          path: out/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build Publish
        run: ./Build.ps1 -Configuration Publish

      - name: Upload Publish package
        uses: actions/upload-artifact@v7
        with:
          name: San9Companion-Publish-win-x86
          path: |
            build/app/Publish/San9Companion.exe
            build/app/Publish/San9PKHardArray.txt
            build/app/Publish/San9PKHardCity.txt
            build/app/Publish/San9PKHardPara.txt
            build/app/Publish/San9PKHardPerson.txt
            build/app/Publish/San9PKHardSkill.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Publish-build-log
          path: out/app/Publish.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download Publish package
        uses: actions/download-artifact@v8
        with:
          name: San9Companion-Publish-win-x86
          path: package

      - name: Create release archive and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $fileTag = $env:RELEASE_TAG -replace '[^A-Za-z0-9._-]', '-'
          $archive = "San9Companion-$fileTag-win-x86.zip"
          $files = @(
            'package/San9Companion.exe'
            'package/San9PKHardArray.txt'
            'package/San9PKHardCity.txt'
            'package/San9PKHardPara.txt'
            'package/San9PKHardPerson.txt'
            'package/San9PKHardSkill.txt'
          )
          Compress-Archive -LiteralPath $files -DestinationPath $archive
          gh release view $env:RELEASE_TAG --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $archive --repo $env:GH_REPO --clobber
          } else {
            gh release create $env:RELEASE_TAG $archive --repo $env:GH_REPO --verify-tag --title $env:RELEASE_TAG --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed' }
